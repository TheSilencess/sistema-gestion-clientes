services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: gift
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gift -d gift"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL con host db para Docker}
      APP_URL: ${APP_URL:?Define APP_URL}
      UPLOAD_DIR: /app/uploads
      ALLOW_INITIAL_SETUP: ${ALLOW_INITIAL_SETUP:-false}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:

